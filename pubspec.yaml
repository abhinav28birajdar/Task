name: task_app
description: A complete task management application
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.1.1
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.0.0

  # Google Sign In
  google_sign_in: ^6.2.1

  # Local Storage
  shared_preferences: ^2.3.2

  # Notifications & Alarm
  flutter_local_notifications: ^18.0.0
  android_alarm_manager_plus: ^5.0.0
  timezone: ^0.9.4

  # Biometric Auth
  local_auth: ^2.3.0

  # Image Picker
  image_picker: ^1.1.2

  # UI & Animations
  lottie: ^3.1.2
  flutter_slidable: ^3.1.0
  animations: ^2.0.11
  shimmer: ^3.0.0
  cached_network_image: 3.3.1
  flutter_svg: ^2.0.12
  iconsax: ^0.0.8
  percent_indicator: ^4.2.3
  google_fonts: ^6.2.1

  # Calendar
  table_calendar: ^3.1.2

  # Connectivity
  connectivity_plus: ^6.0.5

  # DateTime Picker
  omni_datetime_picker: ^2.0.3

  # URL Launcher
  url_launcher: ^6.3.1

  # HTTP (for any REST calls)
  http: ^1.2.2

  # Intl / Date Formatting
  intl: ^0.20.2

  # Permission Handler
  permission_handler: ^11.3.1

  # Sharing
  share_plus: 7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
